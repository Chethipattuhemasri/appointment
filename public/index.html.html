<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body{
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#eef2f7;
}

.box{
background:white;
padding:25px;
border-radius:10px;
width:300px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input, button{
width:100%;
padding:10px;
margin-top:10px;
}

button{
background:#2a7ae2;
color:white;
border:none;
cursor:pointer;
}

</style>
</head>

<body>

<div class="box">
<h2>Login</h2>

<input type="text" id="user" placeholder="Username">
<input type="password" id="pass" placeholder="Password">

<button onclick="login()">Login</button>
<p id="msg"></p>

</div>

<script>
function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u==="admin" && p==="123"){
window.location.href="appointment.html";
}else{
document.getElementById("msg").innerText="❌ Invalid Login";
}
}
</script>

</body>
</html>

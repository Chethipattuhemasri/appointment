<button onclick="sendData()">Send Data</button>
<script>
function sendData() {
  fetch("http://localhost:3000/book", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      name: "Sasi",
      email: "test@gmail.com",
      doctor: "Dr.X",
      date: "2026-03-25",
      time: "10:00 AM"
    })
  })
  .then(res => res.text())
  .then(data => alert(data));
}
</script>
